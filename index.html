<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ізометричні ігри</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg:#0A0908; --panel:#0A0908; --edge:#2A2723;
    --line:#F6F1E7; --detail:#5D5A56; --body:#0E0D0B; --deck:#12110E;
    --ink:#A9A49B; --ink-hi:#F6F1E7; --live:#F6F1E7;
    --glass:#0C0B09; --glass-on:#21180A; --recess:#080706;
    --accent:#F0A628; --accent-hi:#F7C46A; --accent-dim:rgba(240,166,40,.12);
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#d97706; --accent-hi:#f59e0b; --accent-dim:rgba(217,119,6,.08);
  } }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#e9eaea; --panel:#f6f6f5; --edge:#d6d8d8;
    --line:#8e9397; --detail:#c3c6c8; --body:#ececeb; --deck:#f3f3f2;
    --ink:#6a6f73; --ink-hi:#16181a; --live:#0c0d0e;
    --glass:#dcdede; --glass-on:#f3e6da; --recess:#e2e4e4;
    --accent:#d97706; --accent-hi:#f59e0b; --accent-dim:rgba(217,119,6,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; padding:20px 16px 32px; }
  .wrap { max-width:1180px; margin-inline:auto; display:grid; gap:14px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 18px; text-transform:uppercase; letter-spacing:.14em; padding:0 4px; }
  .top .hi { color:var(--ink-hi); }
  .top .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); margin-right:10px; vertical-align:1px; }
  .arrows { display:flex; gap:6px; }
  .arrows button, nav button { font:inherit; color:inherit; background:none; border:1px solid var(--edge); border-radius:10px; cursor:pointer; }
  .arrows button { padding:6px 12px; letter-spacing:.14em; text-transform:uppercase; }
  .arrows button:hover { color:var(--ink-hi); border-color:var(--line); }
  .top .hi { margin-right:auto; }
  .swatches { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--edge); border-radius:999px; }
  .swatches button { width:26px; height:26px; border-radius:50%; border:1px solid transparent; background:none; cursor:pointer; display:grid; place-items:center; padding:0; }
  .swatches button i { width:12px; height:12px; border-radius:50%; background:var(--sw); border:1px solid var(--line); box-shadow:0 0 0 0 var(--sw); transition:box-shadow .2s, transform .2s; }
  .swatches button:hover i { transform:scale(1.15); }
  .swatches button[aria-checked="true"] { border-color:var(--line); }
  .swatches button[aria-checked="true"] i { box-shadow:0 0 10px 1px var(--sw); }
  .swatches button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .layout { display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"nav fig" "credit fig"; gap:14px; align-items:start; }
  .layout > nav { grid-area:nav; } .layout > figure { grid-area:fig; } .layout > .credit { grid-area:credit; }
  .made-with { display:flex; justify-content:flex-end; padding:2px 6px 0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .made-with a { color:var(--line); text-decoration:none; transition:color .2s; }
  .made-with a:hover { color:var(--ink); }
  .credit { align-self:end; display:grid; gap:3px; padding:0 16px 22px; font-size:12px; line-height:1.5; letter-spacing:.04em; }
  .credit a { color:var(--ink); text-decoration:none; width:fit-content; transition:color .2s; }
  .credit a:hover { color:var(--ink-hi); }
  .credit a:hover .ar { color:var(--accent); }
  .credit .ar { color:var(--line); transition:color .2s; }
  .credit .by { color:var(--line); }
  .credit .nm { color:var(--ink); }
  .credit .cr { color:var(--line); margin-top:8px; font-size:11px; display:grid; gap:1px; }
  .credit .cr .hs { white-space:nowrap; }
  .credit .cr a { color:var(--line); }
  .credit .cr a:hover { color:var(--ink-hi); }
  .credit .soc { display:flex; gap:12px; margin-top:4px; }
  .credit .soc a { display:grid; place-items:center; width:16px; height:16px; }
  .credit .soc svg { width:14px; height:14px; fill:currentColor; transition:fill .2s; }
  .credit .soc a:hover svg { fill:var(--accent); }
  .credit a:focus-visible { outline:1px solid var(--accent); outline-offset:2px; border-radius:3px; }
  nav { display:grid; gap:4px; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:14px; }
  nav button { display:flex; gap:12px; align-items:center; text-align:left; padding:9px 12px; border-color:transparent; letter-spacing:.06em; }
  nav button .n { color:var(--line); font-size:12px; transition:color .2s; }
  nav button:hover { color:var(--ink-hi); }
  nav button[aria-current="true"] { color:var(--ink-hi); border-color:var(--edge); background:var(--bg); }
  nav button[aria-current="true"] .n { color:var(--accent); text-shadow:0 0 8px var(--accent); }
  figure { margin:0; background:var(--panel); border:1px solid var(--edge); border-radius:22px; padding:22px 26px; display:grid; gap:6px; min-width:0; }
  .cap { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 18px; text-transform:uppercase; letter-spacing:.14em; }
  .cap .hi { color:var(--ink-hi); text-transform:none; letter-spacing:.05em; }
  #stageHolder { aspect-ratio:4/3; border-radius:14px; transition:background .5s; background:radial-gradient(ellipse 50% 45% at 50% 52%, transparent, transparent); }
  #stageHolder.glow { background:radial-gradient(ellipse 50% 45% at 50% 52%, var(--accent-dim), transparent 72%); }
  #stage { width:100%; height:100%; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  #stage:focus { outline:none; }
  #stage:focus-visible { outline:1px dashed var(--line); outline-offset:4px; border-radius:8px; }
  .fx { position:absolute; width:0; height:0; overflow:hidden; }
  @media (max-width: 820px) {
    .layout { grid-template-columns:1fr; grid-template-rows:auto; grid-template-areas:"nav" "fig" "credit"; }
    .credit { padding:4px 8px 0; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; }
    .credit .soc { margin-top:0; }
    .credit .cr { margin-top:0; flex-basis:100%; }
    nav { position:relative; top:0; display:flex; overflow-x:auto; border-radius:16px; padding:8px; scrollbar-width:none; }
    nav button { flex:none; padding:8px 10px; }
    figure { padding:16px; }
  }

  /* ---------- shared figure vocabulary ---------- */
  #stage text { font-family:var(--mono); }
  .face { fill:var(--body); stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .face.top { fill:var(--deck); }
  .face.recess { fill:var(--recess); }
  .detail { fill:none; stroke:var(--detail); stroke-width:1; vector-effect:non-scaling-stroke; }
  .label { fill:var(--ink); font-family:var(--mono); }
  .glass { fill:var(--glass); transition:fill .3s, stroke .3s; }
  .glass.hot { fill:var(--glass-on); stroke:var(--accent); }
  .halo { fill:var(--accent); opacity:0; transition:opacity .4s; }
  .halo.hot { opacity:.22; }
  .scr { fill:var(--accent-hi); font-family:var(--mono); }
  .scr-accent { fill:var(--accent); }
  .led { fill:var(--detail); transition:fill .2s; }
  .led.hot { fill:var(--accent); }
  .wire { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; transition:stroke .4s; }
  .wire.hot { stroke:var(--accent); }
  .wire-under { fill:none; stroke:var(--panel); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; }
  .pulse { fill:none; stroke:var(--accent-hi); stroke-width:2.2; stroke-linecap:round; vector-effect:non-scaling-stroke;
           stroke-dasharray:70 1200; stroke-dashoffset:70; opacity:0; }
  .pulse.go { animation:flow .55s linear; }
  @keyframes flow { 0% { stroke-dashoffset:70; opacity:1; } 90% { opacity:1; } 100% { stroke-dashoffset:-1000; opacity:0; } }
  .press { cursor:pointer; transition:transform 60ms ease-out; }
  .press.down { transform:translateY(3px); }
  .press .face { transition:fill .6s ease-out, stroke .6s ease-out; }
  .press.lit .face, .press.latched .face { fill:var(--accent); stroke:var(--accent-hi); transition:none; }
  .press.lit .face.top, .press.latched .face.top { fill:var(--accent-hi); }
  .press.lit { filter:url(#glow); }
  .press.latched { filter:url(#soft); }
  .press:hover .face.top { stroke:var(--ink); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) {
    .press, .glass, .halo, .press .face, .wire { transition:none; } .blink { animation:none; } .pulse.go { animation:none; }
  }
  .top .swatches, .top .arrows, .layout > nav { display:none !important; }
  .layout { grid-template-columns:minmax(0,1fr) !important; grid-template-areas:"fig" !important; }
  body { padding-bottom:16px; }
  /* fit the whole plate in one screen: the svg letterboxes inside a height-capped holder */
  #stageHolder { aspect-ratio:auto; width:100%; height:clamp(220px, calc(100dvh - 216px - var(--navh, 0px)), 62vw); }
  :root { --navh: 56px; }
  .layout { grid-template-areas:"nav" "fig" !important; }
  .layout > nav { display:flex !important; gap:6px; padding:6px; border-radius:16px; overflow-x:auto; scrollbar-width:none; }
  .layout > nav button { flex:none; padding:8px 14px; }
</style>
</head>
<body>
<svg class="fx" aria-hidden="true">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="-2000" y="-2000" width="6000" height="6000"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
</svg>
<div class="wrap">
  <div class="top">
    <span class="hi"><span class="dot"></span>Ізометричні ігри</span>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Glow colour"></div>
    <div class="arrows"><button id="prev" aria-label="Previous figure">← Prev</button><button id="next" aria-label="Next figure">Next →</button></div>
  </div>
  <div class="layout">
    <nav id="nav" aria-label="Figures"></nav>
    <!-- optional: <aside class="credit">Made by … <a href="…">…</a></aside> (styles below) -->
    <figure>
      <div class="cap"><span class="hi" id="fignum">Fig 1</span><span id="figname"></span></div>
      <div id="stageHolder"></div>
      <div class="cap"><span id="hint"></span><span class="hi" id="readout"></span></div>
    </figure>
  </div>
  <!-- Made-with credit: keep by default; delete this footer if you don't want it. -->
</div>
<script>
  // Gallery settings: palette 'ember' | 'city' | your own [[name, darkAccent, darkHi, lightAccent, lightHi], ...]
  window.GALLERY = { palette: [['PubBoard','#F0A628','#F7C46A','#F0A628','#F7C46A']], autoDemo: false, storageKey: 'iso-dark-accent' };
  const FIGS = [];
</script>
<!-- FIGURES: one <script> per figure, each calling FIGS.push({...}). Order here = Fig 1, 2, 3 ... -->
<script>
FIGS.push({
  id: 'kyiv', name: 'Київ · енергосистема',
  hint: 'Мета: тримай навантаження нижче генерації · рубильники 1–0 або клік · ←→ вибір, пробіл перемикає',
  aria: 'Ізометрична карта Києва з десятьма районами, у кожному свій житловий будинок. Праворуч трансформатор з десятьма рубильниками: вимкнений рубильник знеструмлює свій район.',
  css: `
    [data-fig="kyiv"] { --water:#16436F; --water-edge:#3B7FC4; --water-hi:#6FA8E0; --alarm:#E5484D; --alarm-hi:#FF9A9C; }
    [data-fig="kyiv"].alarm .blade { fill: var(--alarm); stroke: var(--alarm-hi); }
    [data-fig="kyiv"].alarm .bladeg { filter: url(#glow); animation: kyiv-blink .6s steps(2) infinite; }
    [data-fig="kyiv"].alarm .sw .led, [data-fig="kyiv"].alarm #kyiv-warn { fill: var(--alarm); }
    [data-fig="kyiv"].alarm .sw > rect.recess { stroke: var(--alarm); }
    [data-fig="kyiv"] .dist { fill: var(--deck); stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; cursor: pointer; }
    [data-fig="kyiv"] .tint { fill: var(--accent); opacity: 0; pointer-events: none; transition: opacity .35s; }
    [data-fig="kyiv"] .tint.on { opacity: .07; }
    [data-fig="kyiv"] .river { fill: var(--water); stroke: var(--water-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
    [data-fig="kyiv"] .wave { fill: none; stroke: var(--water-hi); opacity: .7; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 3 4; }
    [data-fig="kyiv"] .win { fill: var(--glass); stroke: var(--detail); stroke-width: .6; vector-effect: non-scaling-stroke; transition: fill .25s; }
    [data-fig="kyiv"] .bld { cursor: pointer; }
    [data-fig="kyiv"] .bld.on .win:not(.nl) { fill: var(--accent); stroke: var(--accent-hi); }
    [data-fig="kyiv"] .bld.on .wins { filter: url(#soft); }
    [data-fig="kyiv"] .dname { fill: var(--ink); font-family: var(--mono); font-size: 6.5px; text-anchor: middle; pointer-events: none; transition: fill .3s;
      paint-order: stroke; stroke: var(--panel); stroke-width: 2.6px; stroke-linejoin: round; }
    [data-fig="kyiv"] .dname.on { fill: var(--ink-hi); }
    @media (max-width: 700px) { [data-fig="kyiv"] .dname { font-size: 10px; stroke-width: 3.4px; } }
    [data-fig="kyiv"] .sw { cursor: pointer; }
    [data-fig="kyiv"] .blade { fill: var(--detail); stroke: var(--line); stroke-width: .8; vector-effect: non-scaling-stroke; }
    [data-fig="kyiv"] .sw.on .blade { fill: var(--accent); stroke: var(--accent-hi); }
    [data-fig="kyiv"] .sw.on .bladeg { filter: url(#soft); }
    [data-fig="kyiv"] .selm { fill: none; stroke: var(--ink-hi); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; }
    [data-fig="kyiv"] .selm.hot { opacity: 1; }
    [data-fig="kyiv"] .lbl { fill: var(--ink); font-family: var(--mono); }
    [data-fig="kyiv"] .over { animation: kyiv-blink .4s steps(2) infinite; }
    @keyframes kyiv-blink { 50% { opacity: .2; } }
  `,
  mount(stage, api) {
    // map coordinates (u = east, v = south) laid straight onto the iso floor: north points up-right
    const Z = 4;
    const M = (u, v) => [u, v];

    // load is split by population (тис. осіб, 1 Jan 2016, the last full per-district table); total demand stays 1170 MW
    const D = [
      { n: 'Оболонський',    s: 'ОБОЛОНЬ',   mw: 128, pop: 315.5, a: [100,26], p: [[55,8],[142,0],[134.5,45],[100,50],[70,55],[55,40]] },
      { n: 'Святошинський',  s: 'СВЯТОШИН',  mw: 138, pop: 340.7, a: [36,92],  p: [[8,45],[55,40],[70,55],[72,95],[60,130],[10,135],[5,90]] },
      { n: 'Подільський',    s: 'ПОДІЛ',     mw: 80, pop: 198.1,  a: [110,72], p: [[70,55],[100,50],[134.5,45],[132,60],[139,95],[110,95],[72,95]] },
      { n: 'Шевченківський', s: 'ШЕВЧЕНКО',  mw: 93, pop: 230.2, a: [92,113], p: [[72,95],[118,95],[118,130],[90,135],[60,130]] },
      { n: 'Печерський',     s: 'ПЕЧЕРСЬК',  mw: 62, pop: 152.0,  a: [134,124],p: [[118,95],[139,95],[142,110],[152,150],[120,150],[118,130]] },
      { n: 'Солом’янський',  s: 'СОЛОМ’ЯН',  mw: 148, pop: 364.8, a: [62,155], p: [[10,135],[60,130],[90,135],[118,130],[120,150],[95,160],[80,180],[30,175]] },
      { n: 'Голосіївський',  s: 'ГОЛОСІЇВ',  mw: 103, pop: 253.1, a: [112,200],p: [[30,175],[80,180],[95,160],[120,150],[152,150],[142,200],[156,240],[90,238],[45,215]] },
      { n: 'Деснянський',    s: 'ДЕСНЯН',    mw: 146, pop: 358.3, a: [196,40], p: [[160,0],[225,10],[235,70],[195,82],[153,75],[150,60]] },
      { n: 'Дніпровський',   s: 'ДНІПРОВ',   mw: 144, pop: 354.7, a: [202,110],p: [[153,75],[195,82],[235,70],[232,140],[190,138],[167.5,140],[160,110]] },
      { n: 'Дарницький',     s: 'ДАРНИЦЯ',   mw: 128, pop: 314.7, a: [202,186],p: [[167.5,140],[190,138],[232,140],[228,225],[174,240],[160,200],[170,150]] },
    ];
    const RW = [[142,0],[132,60],[142,110],[152,150],[142,200],[156,240]];
    const RE = [[160,0],[150,60],[160,110],[170,150],[160,200],[174,240]];
    const SLAB = [[-6,-10],[246,-10],[246,246],[-6,246]];
    const anchors = D.map(d => M(...d.a));

    // the scene is drawn for one of two layouts: wide (yard to the right) or phone portrait (yard below the map)
    const mq = window.matchMedia('(max-width: 700px)');
    let R, loadEl, capEl, warn, feed, feedp, hv;
    function draw(mobile) {
    const SH = mobile ? [-30, 300] : [0, 0];
    const sh = ([x, y, z]) => [x + SH[0], y + SH[1], z];
    const K = api.iso.frame([
      ...SLAB.map(([u, v]) => [...M(u, v), -8]), ...SLAB.map(([u, v]) => [...M(u, v), 0]),
      ...[[292,16,-8],[378,16,-8],[292,90,-8],[378,90,-8],[300,60,100],[360,60,100]].map(sh),
      [...anchors[4], 128], [...anchors[0], 96],
    ], 0.03, mobile ? 1.05 : 16 / 9);   // frame shape follows the layout so the plate is filled
    const { P, TOP, FRONT, SIDE, rect, box, path } = K;
    const [shx, shy] = K.D(SH[0], SH[1], 0), shT = `translate(${shx} ${shy})`;
    const FEED = mobile ? [[285,360,0.4],[262,300,0.4],[222,246,0.4]] : [[300,80,0.4],[272,96,0.4],[246,112,0.4]];

    // polygon helpers in map coords
    const poly = (pts, z, cls, extra = '') => `<path class="${cls}" ${extra} d="${'M' + pts.map(([u, v]) => P(...M(u, v), z).map(n => n.toFixed(2)).join(' ')).join('L')}Z"/>`;
    function extrude(pts, z0, z1) {
      const xy = pts.map(([u, v]) => M(u, v));
      let A = 0; xy.forEach((a, i) => { const b = xy[(i + 1) % xy.length]; A += a[0] * b[1] - b[0] * a[1]; });
      let s = '';
      xy.forEach((a, i) => {
        const b = xy[(i + 1) % xy.length], ex = b[0] - a[0], ey = b[1] - a[1];
        const n = A > 0 ? [ey, -ex] : [-ey, ex];
        if (n[0] + n[1] <= 0) return;
        const q = [P(a[0], a[1], z0), P(b[0], b[1], z0), P(b[0], b[1], z1), P(a[0], a[1], z1)];
        s += `<path class="face" d="M${q.map(p => p.map(v => v.toFixed(2)).join(' ')).join('L')}Z"/>`;
      });
      return s;
    }

    // deterministic "someone is not home" pattern
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const wins = (T, u0, v0, cols, rows, du, dv, cw, ch) => {
      let s = `<g transform="${T}">`;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
        s += `<rect class="win${rnd() < 0.18 ? ' nl' : ''}" x="${(u0 + c * du).toFixed(2)}" y="${(v0 + r * dv).toFixed(2)}" width="${cw}" height="${ch}"/>`;
      return s + '</g>';
    };
    const both = (x, y, w, d, h, opts) => {   // same window rhythm on the front and side faces
      const [u0, v0, cf, cs, rows, du, dv, cw, ch] = opts;
      return wins(FRONT(x, y + d, Z + h), u0, v0, cf, rows, du, dv, cw, ch) + wins(SIDE(x + w, y + d, Z + h), u0, v0, cs, rows, du, dv, cw, ch);
    };
    const tri = pts => `<path class="face" d="${path(pts)}Z"/>`;

    // ten different residential buildings; (x, y) is the back corner of the footprint
    const BUILD = [

    svg += box(300,60,0, 60,22,96);

    svg += `<g transform="${SIDE(360,82,96)}">${api.iso.slits(4,18,3.5, 30,60)}
      <path class="face" d="M11 8 L17 19 L5 19 Z"/><path class="lbl" d="M11.6 10.5 L9.2 15 L11.3 15 L10.2 18 L13 13.6 L10.9 13.6 Z"/></g>`;

    let cab = `<g transform="${FRONT(300,82,96)}">
      <text class="lbl" x="4" y="4.6" font-size="3">НАВАНТАЖЕННЯ / ГЕНЕРАЦІЯ</text>

    D.forEach((d, i) => {
      const cu = 6 + (i % 5) * 12, v0 = i < 5 ? 20 : 58, hv = v0 + 15;
      cab += `<g class="sw" id="kyiv-s${i}" data-i="${i}">
        <rect class="face recess" x="${cu-4.5}" y="${v0}" width="9" height="28" rx="1"/>
        <rect class="led" id="kyiv-c${i}" x="${cu-2.6}" y="${v0+1.4}" width="5.2" height="2.4" rx=".6"/>
        <g class="bladeg" id="kyiv-bl${i}" data-h="${cu} ${hv}">
          <rect class="blade" x="${cu-1}" y="${v0+3.2}" width="2" height="12"/>
          <rect class="blade" x="${cu-3.6}" y="${v0+2.2}" width="7.2" height="2.4" rx="1"/>
        </g>
        <circle class="face" cx="${cu}" cy="${hv}" r="1.5"/>
        <text class="lbl" x="${cu}" y="${v0+32.5}" font-size="2.5" text-anchor="middle">${(i + 1) % 10} ${d.s}</text>
        <rect class="selm" id="kyiv-m${i}" x="${cu-5.6}" y="${v0-1.2}" width="11.2" height="35.6" rx="1.5"/>

    });
    svg += cab + `<rect id="kyiv-warn" class="led" x="50" y="15.5" width="6" height="2" rx="1"/></g></g>`;

    stage.setAttribute('viewBox', K.viewBox); stage.innerHTML = svg;
    const $ = id => stage.querySelector('#' + id);
    R = D.map((d, i) => ({ sw: $('kyiv-s'+i), c: $('kyiv-c'+i), bl: $('kyiv-bl'+i), m: $('kyiv-m'+i), b: $('kyiv-b'+i), t: $('kyiv-t'+i), n: $('kyiv-n'+i) }));
    loadEl = $('kyiv-load'); capEl = $('kyiv-cap'); warn = $('kyiv-warn'); feed = $('kyiv-feed'); feedp = $('kyiv-feedp');
    hv = [0,1,2].map(j => $('kyiv-hv'+j));
    }
    draw(mq.matches);
    const onMq = e => { draw(e.matches); render(); };
    mq.addEventListener('change', onMq);
    // disclaimer in the page header (free space there, so the plate still fits one screen)
    const note = document.createElement('span');
    note.className = 'kyiv-note';
    note.textContent = 'Генерація і споживання — умовні ігрові цифри · розподіл між районами за населенням (2016)';
    note.style.cssText = 'color:var(--ink);text-transform:none;letter-spacing:.03em;font-size:12px';
    document.querySelector('.top')?.append(note);
    // the goal is the point of the game: lift it out of the hint into a lit chip that turns red on overload
    const goalCss = document.createElement('style');
    goalCss.textContent = `
      .kyiv-goal { display:inline-flex; align-items:center; gap:8px; margin-right:14px; padding:4px 12px; border-radius:999px;
        color:var(--accent-hi); border:1px solid var(--accent); background:var(--accent-dim); box-shadow:0 0 14px var(--accent-dim);
        letter-spacing:.12em; transition:color .2s, border-color .2s, background .2s; }
      .kyiv-goal::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
      .kyiv-goal.warn { color:#FF9A9C; border-color:#E5484D; background:rgba(229,72,77,.14); box-shadow:0 0 16px rgba(229,72,77,.35);
        animation:kyiv-goal-blink .6s steps(2) infinite; }
      .kyiv-goal.warn::before { background:#E5484D; box-shadow:0 0 8px #E5484D; }
      @keyframes kyiv-goal-blink { 50% { opacity:.55; } }
      #hint { display:flex; flex-wrap:wrap; align-items:center; gap:6px 0; }
      .kyiv-pad { display:none; }
      .kyiv-touch { display:none; }
      @media (max-width: 700px) {
        #stageHolder { height:clamp(240px, calc(100dvh - 330px - var(--navh, 0px)), calc(100vw - 30px)); }
        figure { padding:14px 12px; }
        .top { gap:4px 12px; }
        .kyiv-note { font-size:10.5px !important; }
        .kyiv-goal { margin-right:0; font-size:11px; letter-spacing:.08em; padding:4px 10px; }
        .kyiv-keys { display:none; }
        .kyiv-touch { display:inline; font-size:11px; }
        .kyiv-pad { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin:4px 0 2px; }
        .kyiv-pad button { font:inherit; font-size:9.5px; letter-spacing:.02em; color:var(--ink); background:var(--bg); border:1px solid var(--edge);
          border-radius:10px; padding:8px 2px 7px; display:grid; justify-items:center; gap:5px; cursor:pointer; touch-action:manipulation; min-height:44px; }
        .kyiv-pad button i { width:18px; height:4px; border-radius:2px; background:var(--detail); }
        .kyiv-pad button.on { color:var(--accent-hi); border-color:var(--accent); }
        .kyiv-pad button.on i { background:var(--accent); box-shadow:0 0 8px var(--accent); }
        .kyiv-pad.alarm button { color:#FF9A9C; border-color:#E5484D; animation:kyiv-goal-blink .6s steps(2) infinite; }
        .kyiv-pad.alarm button i { background:#E5484D; box-shadow:0 0 8px #E5484D; }
      }`;
    document.head.append(goalCss);
    const hintEl = document.getElementById('hint');
    if (hintEl) hintEl.innerHTML = '<span class="kyiv-goal" id="kyiv-goal">Мета: тримай навантаження нижче генерації</span><span class="kyiv-keys">Рубильники 1–0 або клік · ←→ вибір, пробіл перемикає</span><span class="kyiv-touch">Торкайся рубильників або будинків</span>';
    const goalEl = document.getElementById('kyiv-goal');
    // phones: the cabinet switches are too small to tap, so mirror them as a row of touch buttons
    const pad = document.createElement('div');
    pad.className = 'kyiv-pad';
    pad.innerHTML = D.map((d, i) => `<button type="button" data-k="${i}"><i></i>${d.s}</button>`).join('');
    pad.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) toggle(+b.dataset.k); });
    stage.parentElement.after(pad);
    const padBtns = [...pad.querySelectorAll('button')];

    const MAXMW = 1400, TOTAL = D.reduce((s, d) => s + d.mw, 0);
    const st = { on: D.map(() => true), sel: 0, cap: 1300, capTo: 1300, over: 0, t: 0, litTime: 0, nextCap: 12, tripped: 0, last: 0 };
    const load = () => D.reduce((s, d, i) => s + (st.on[i] ? d.mw : 0), 0);

    function render() {
      const L = load(), any = st.on.some(Boolean);
      R.forEach((r, i) => {
        const on = st.on[i];
        r.sw.classList.toggle('on', on); r.c.classList.toggle('hot', on);
        r.b.classList.toggle('on', on); r.t.classList.toggle('on', on); r.n.classList.toggle('on', on);
        r.m.classList.toggle('hot', st.sel === i);
        padBtns[i].classList.toggle('on', on);
        const [hx, hy] = r.bl.dataset.h.split(' ');
        r.bl.setAttribute('transform', on ? '' : `rotate(180 ${hx} ${hy})`);
      });
      loadEl.setAttribute('width', (50 * L / MAXMW).toFixed(2));
      capEl.setAttribute('x', (5 + 50 * st.cap / MAXMW).toFixed(2));
      const over = L > st.cap;
      loadEl.classList.toggle('over', over); goalEl?.classList.toggle('warn', over || !!st.alarm); warn.classList.toggle('hot', over); warn.classList.toggle('over', over);
      feed.classList.toggle('hot', any); hv.forEach(w => w.classList.toggle('hot', any));
      stage.classList.toggle('alarm', !!st.alarm); pad.classList.toggle('alarm', !!st.alarm);
      api.power(any);
    }
    function readout() {
      const L = load(), n = st.on.filter(Boolean).length, pct = st.t > 0 ? Math.round(100 * st.litTime / st.t) : 100;
      let s;
      if (st.alarm) s = 'аварія · захист вимкнув усі лінії · увімкни рубильник';
      else if (st.note && st.t < st.note.until && L <= st.cap) s = st.note.txt;
      else if (L > st.cap) s = `перевантаження ${L} / ${Math.round(st.cap)} МВт · ${Math.ceil(5 - st.over)} с до аварії`;
      else s = `${L} / ${Math.round(st.cap)} МВт · ${n}/10 районів · світло ${pct}%`;
      if (s !== st.lastMsg) { api.readout(s); st.lastMsg = s; }
    }
    // synthesized knife-switch sounds: mechanical clack + thump, an arc zap and transformer hum on closing
    let A = null, NOISE = null;
    function snd(kind) {
      try {
        if (!A && kind === 'trip') return;
        A = api.audio();   // cached; also resumes a context that started suspended
        const { ctx, out } = A, t = ctx.currentTime;
        if (!NOISE) {
          NOISE = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
          const ch = NOISE.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        }
        const env = (node, at, peak, dur) => { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(peak, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
          node.connect(g); g.connect(out); return g; };
        const noise = (at, type, f, q, peak, dur) => { const n = ctx.createBufferSource(); n.buffer = NOISE;
          const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
          n.connect(b); env(b, at, peak, dur); n.start(at); n.stop(at + dur + 0.02); };
        const tone = (at, type, f0, f1, peak, dur, lp) => { const o = ctx.createOscillator(); o.type = type;
          o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur);
          let node = o; if (lp) { const b = ctx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = lp; o.connect(b); node = b; }
          env(node, at, peak, dur); o.start(at); o.stop(at + dur + 0.02); };
        const clack = (at, f) => { noise(at, 'bandpass', f, 1.4, 0.9, 0.07); tone(at, 'sine', 140, 45, 0.7, 0.12); };
        if (kind === 'on') {
          clack(t, 2600);
          noise(t + 0.012, 'highpass', 3500, 0.7, 0.35, 0.06);          // arc as the blade meets the contacts
          tone(t + 0.02, 'sawtooth', 100, 100, 0.07, 0.45, 420);        // transformer picks up the load
        } else if (kind === 'off') {
          clack(t, 1700);
          tone(t, 'sawtooth', 100, 55, 0.06, 0.3, 380);                  // hum dies away
        } else if (kind === 'trip') {
          [0, 0.05, 0.11, 0.16].forEach((d, j) => clack(t + d, 1400 + j * 300));
          noise(t, 'bandpass', 900, 0.8, 0.6, 0.35);
          tone(t, 'sawtooth', 100, 40, 0.12, 0.6, 500);
        }
      } catch (e) {}
    }
    function toggle(i) {
      st.on[i] = !st.on[i]; st.sel = i; st.alarm = false;
      st.note = { until: st.t + 2.2, txt: `${D[i].n} · ${D[i].pop} тис. жителів · ${D[i].mw} МВт · ${st.on[i] ? 'увімкнено' : 'вимкнено'}` };
      snd(st.on[i] ? 'on' : 'off');
      if (st.on[i]) api.replay(feedp, 'go');
      render(); readout();
    }

    api.loop(ts => {
      if (!st.last) st.last = ts;
      const dt = Math.min(0.1, (ts - st.last) / 1000); st.last = ts;
      st.t += dt; st.litTime += dt * st.on.filter(Boolean).length / 10;
      if (st.tripped > 0) st.tripped -= dt;
      // generation drifts: after a calm start it wanders between ~55% and ~105% of full demand
      st.nextCap -= dt;
      if (st.nextCap <= 0) { st.capTo = 650 + Math.random() * 600; st.nextCap = 7 + Math.random() * 5; }
      st.cap += (st.capTo - st.cap) * Math.min(1, dt * 0.8);
      if (load() > st.cap) {
        st.over += dt;
        if (st.over >= 5) { st.on = st.on.map(() => false); st.over = 0; st.tripped = 3; st.alarm = true; snd('trip'); }
      } else st.over = Math.max(0, st.over - dt * 2);
      render(); readout();
    });

    stage.addEventListener('click', e => {
      const t = e.target.closest('[data-i]');
      if (t && stage.contains(t)) toggle(+t.dataset.i);
    });
    render(); readout();

    return {
      key(e) {
        if (/^[0-9]$/.test(e.key)) { toggle((+e.key + 9) % 10); return true; }
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { st.sel = (st.sel + 1) % 10; render(); return true; }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { st.sel = (st.sel + 9) % 10; render(); return true; }
        if (e.key === ' ' || e.key === 'Enter') { toggle(st.sel); return true; }
        return false;
      },
      unmount() { note.remove(); goalCss.remove(); pad.remove(); mq.removeEventListener('change', onMq); },
      demo() { api.after(400, () => toggle(4)); api.after(900, () => toggle(7)); },
    };
  },
});

  hint: 'Треки 1–4 або кнопки · пробіл — стоп / старт · L — режим світла',
  aria: 'Ізометрична диско-вечірка: танцпол зі світлом, диско-куля, діджейський пульт з перемикачами треків, колонки і світломузика, що реагує на звук.',
  css: `
    [data-fig="disco"] { --c1: var(--accent); --c2: #FF4FA3; --c3: #3DD6F5; }
    [data-fig="disco"] .k1 { fill: var(--c1); } [data-fig="disco"] .k2 { fill: var(--c2); } [data-fig="disco"] .k3 { fill: var(--c3); }
    [data-fig="disco"] .tile { stroke: none; }
    [data-fig="disco"] .tbase { fill: var(--recess); stroke: var(--detail); stroke-width: .6; vector-effect: non-scaling-stroke; }
    [data-fig="disco"] .spark { fill: var(--ink-hi); }

    [data-fig="disco"] .person { fill: none; stroke: var(--ink-hi); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

    [data-fig="disco"] .facet { fill: none; stroke: var(--line); stroke-width: .6; vector-effect: non-scaling-stroke; opacity: .7; }

    [data-fig="disco"] .pad.on { fill: var(--accent); stroke: var(--accent-hi); }
    [data-fig="disco"] .padg { cursor: pointer; }

  mount(stage, api) {
    const BALL = [180, 156, 100];
    const K = api.iso.frame([[0,0,-8],[300,0,-8],[0,240,-8],[300,240,-8],[0,0,124],[300,0,124],[0,240,124],[180,140,232]], 0.04, 4 / 3);
    const { P, TOP, FRONT, SIDE, rect, box, path } = K;
    const f2 = n => n.toFixed(2);

    // room: floor plate, back and left walls with a neon sign and acoustic slats
    let svg = box(0,0,-8, 300,240,8, 10);
    svg += box(0,0,0, 300,6,124) + box(0,0,0, 6,240,124);
    svg += `<g transform="${SIDE(6,240,124)}">${api.iso.slits(20,214,10, 14,108)}</g>`;
    svg += `<g transform="${FRONT(6,6,124)}">${api.iso.slits(14,60,8, 14,108)}${api.iso.slits(250,290,8, 14,108)}
      <text id="disco-neon" class="neon" x="174" y="62" font-size="19" text-anchor="middle" filter="url(#glow)">ДИСКО</text></g>`;

    // dance floor: raised platform with a 7×7 grid of light tiles
    const FX = 110, FY = 86, N = 7, TS = 20;
    svg += box(FX-2,FY-2,0, N*TS+4,N*TS+4,4, 2);
    let tiles = `<g transform="${TOP(FX,FY,4)}">`;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      tiles += `<rect class="tbase" x="${i*TS+1}" y="${j*TS+1}" width="${TS-2}" height="${TS-2}" rx="1.5"/>`;
      tiles += `<rect id="disco-t${i}-${j}" class="tile k1" x="${i*TS+1}" y="${j*TS+1}" width="${TS-2}" height="${TS-2}" rx="1.5" opacity="0"/>`;
    }
    svg += tiles + '</g>';
    // light pools of the PAR beams (on the floor, under the dancers)
    [0,1,2,3].forEach(k => { svg += `<ellipse id="disco-pool${k}" class="${['k1','k2','k3','k1'][k]}" rx="30" ry="17" opacity="0" filter="url(#bloom)"/>`; });
    // mirror-ball reflections, positioned every frame
    svg += `<g id="disco-sparks">${Array.from({ length: 80 }, () => '<circle class="spark" r="1.3"/>').join('')}</g>`;

    // speakers either side of the booth
    const speaker = x => box(x,18,0, 22,22,72) + `<g transform="${FRONT(x,40,72)}">
      <circle class="cone sp-w" cx="11" cy="20" r="8"/><circle class="detail" cx="11" cy="20" r="3"/>
      <circle class="cone sp-w" cx="11" cy="45" r="8"/><circle class="detail" cx="11" cy="45" r="3"/>
      <circle class="cone" cx="11" cy="63" r="3"/></g>`;
    svg += speaker(76);

    // DJ behind the booth (billboard), arms toward the decks
    const [djx, djy] = P(180, 13, 0);
    svg += `<g id="disco-dj" transform="translate(${f2(djx)} ${f2(djy)})"><g transform="scale(1.5)">
      <path class="person" d="M0 -14 L0 -28 M-8 -24 L0 -26 L8 -24"/>
      <circle class="head" id="disco-djh" cx="0" cy="-33" r="4.2"/>
      <path class="person" d="M-4.8 -33 A4.8 4.8 0 0 1 4.8 -33" style="stroke:var(--accent)"/>
      <rect x="-6" y="-34.5" width="2" height="3.5" rx=".8" class="k1"/><rect x="4" y="-34.5" width="2" height="3.5" rx=".8" class="k1"/>
    </g></g>`;

    // DJ booth: decks + mixer on top, track pads and the light-music console on the front
    svg += box(100,20,0, 160,24,34, 2);
    svg += `<g transform="${TOP(100,20,34)}">
      ${[32,128].map((cx, k) => `<circle class="face recess" cx="${cx}" cy="12" r="10.5"/><g id="disco-plat${k}"><circle class="detail" cx="${cx}" cy="12" r="7"/>
        <line class="we-line" x1="${cx}" y1="12" x2="${cx}" y2="5" style="stroke:var(--ink-hi);stroke-width:1;vector-effect:non-scaling-stroke"/></g>
        <circle class="k1" cx="${cx}" cy="12" r="1.4"/><path class="wire" d="M${cx+13} 3 L${cx+12} 14 L${cx+6} 17"/>`).join('')}
      <rect class="face recess" x="58" y="4" width="44" height="16" rx="1.5"/>
      ${[0,1,2,3].map(k => `<rect class="detail" x="${64+k*9}" y="7" width="1" height="11"/><rect id="disco-fd${k}" class="face" x="${62+k*9}" y="12" width="5" height="2.4" rx=".6"/>`).join('')}
    </g>`;
    const TRACKS = ['ДИСКОТЕКА 77', 'НІЧНИЙ КИЇВ', 'ФАНК-СОДА', 'НЕОНОВИЙ ДНІПРО'];
    let panel = `<g transform="${FRONT(100,44,34)}">
      <text class="lbl" x="6" y="5.5" font-size="3.4" letter-spacing=".6">ТРЕКИ</text>
      <text class="lbl" x="130" y="5.5" font-size="3.4" letter-spacing=".6">СВІТЛОМУЗИКА</text>`;
    const PADS = [...TRACKS.map((t, i) => ({ k: 't' + i, label: `${i + 1} ${t.split(' ')[0]}` })), { k: 'stop', label: 'СТОП' }, { k: 'light', label: 'СВІТЛО' }];
    PADS.forEach((p, i) => {
      const u = 6 + i * 20;
      panel += `<g class="padg" id="disco-p${p.k}" data-pad="${p.k}"><rect class="pad" x="${u}" y="8" width="17" height="11" rx="1.6"/>
        <text class="lbl" x="${u + 8.5}" y="24.5" font-size="2.7" text-anchor="middle">${p.label}</text></g>`;
    });
    ['НЧ','СЧ','ВЧ'].forEach((b, k) => {
      const u = 131 + k * 9;
      panel += `<rect class="vu" x="${u}" y="8" width="6" height="18" rx="1"/><rect id="disco-vu${k}" class="k${k+1}" x="${u}" y="26" width="6" height="0" rx="1" filter="url(#soft)"/>
        <text class="lbl" x="${u + 3}" y="30.5" font-size="2.6" text-anchor="middle">${b}</text>`;
    });
    svg += panel + '</g>';
    svg += speaker(262);

    // dancers (billboards), back to front
    const DANCERS = [[205,140],[150,150],[235,175],[175,190],[132,210],[214,222]];
    svg += '<g id="disco-crowd">';
    DANCERS.forEach(([x, y], i) => {
      svg += `<g id="disco-d${i}"><g transform="scale(1.5)"><path class="person" id="disco-dp${i}" d=""/><circle class="head" id="disco-dh${i}" cx="0" cy="-33" r="4.2"/></g></g>`;
    });
    svg += '</g>';

    // truss with four PAR cans, then the mirror ball on its wire
    svg += box(6,56,168, 284,8,6);
    svg += `<g transform="${FRONT(6,64,174)}">${api.iso.slits(6,280,8, 1,5)}</g>`;
    const LAMPS = [110, 155, 205, 250];
    LAMPS.forEach((lx, k) => {
      svg += box(lx-5,54,150, 10,12,18, 3);
      svg += `<g transform="${FRONT(lx-5,66,166)}"><circle id="disco-lens${k}" class="${['k1','k2','k3','k1'][k]}" cx="5" cy="9" r="3.6" opacity=".15" filter="url(#glow)"/></g>`;
    });
    svg += `<path class="wire" d="${path([[BALL[0],BALL[1],232],[BALL[0],BALL[1],BALL[2]+14]])}"/>`;
    const [bx, by] = P(...BALL);
    svg += `<defs><clipPath id="disco-clip"><circle cx="${f2(bx)}" cy="${f2(by)}" r="14"/></clipPath></defs>
      <circle class="ball" cx="${f2(bx)}" cy="${f2(by)}" r="14"/>
      <g clip-path="url(#disco-clip)"><g id="disco-mer"></g>
        ${[-10.5,-7,-3.5,0,3.5,7,10.5].map(dy => `<line class="facet" x1="${f2(bx-15)}" x2="${f2(bx+15)}" y1="${f2(by+dy)}" y2="${f2(by+dy)}"/>`).join('')}
        <g id="disco-glints">${Array.from({ length: 12 }, () => '<rect class="glint" width="2.6" height="2.6" opacity="0"/>').join('')}</g></g>`;

    // light beams last, blended over everything
    LAMPS.forEach((lx, k) => { svg += `<path id="disco-beam${k}" class="beam ${['k1','k2','k3','k1'][k]}" opacity="0" d=""/>`; });
    const vb = K.viewBox.split(' ').map(Number);
    svg += `<rect id="disco-strobe" class="strobe" x="0" y="0" width="${vb[2]}" height="${vb[3]}" opacity="0"/>`;

    stage.setAttribute('viewBox', K.viewBox); stage.innerHTML = svg;
    const $ = id => stage.querySelector('#' + id);
    const tilesEl = []; for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) tilesEl.push({ i, j, el: $(`disco-t${i}-${j}`) });
    const sparks = [...stage.querySelectorAll('#disco-sparks circle')];
    const glints = [...stage.querySelectorAll('#disco-glints rect')];
    const mer = $('disco-mer'), neon = $('disco-neon'), strobe = $('disco-strobe'), dj = $('disco-dj');
    const plat = [0,1].map(k => $('disco-plat' + k)), fader = [0,1,2,3].map(k => $('disco-fd' + k));
    const vu = [0,1,2].map(k => $('disco-vu' + k)), cones = [...stage.querySelectorAll('.sp-w')];
    const beams = [0,1,2,3].map(k => $('disco-beam' + k)), pools = [0,1,2,3].map(k => $('disco-pool' + k)), lens = [0,1,2,3].map(k => $('disco-lens' + k));
    // dancers live on the tile grid (rows 2–6, so nobody blocks the booth) and hop between tiles
    const tileC = (i, j) => [FX + i * TS + TS / 2, FY + j * TS + TS / 2];
    const dancers = DANCERS.map(([x, y], i) => {
      const tile = [Math.min(N - 1, Math.floor((x - FX) / TS)), Math.max(2, Math.min(N - 1, Math.floor((y - FY) / TS)))];
      return { g: $('disco-d' + i), p: $('disco-dp' + i), h: $('disco-dh' + i), tile, w: tileC(...tile), hop: 0, mv: null, lastStep: -9, col: 1, ph: i % 3 };
    });
    const crowd = $('disco-crowd'), flashT = {};
    let crowdOrder = '';
    const djHead = $('disco-djh');
    // a head takes the colour of the light that hits it (nearest beam pool), brightness follows that beam
    const paintHead = (el, col, a) => {
      if (a < 0.05) { el.style.fill = ''; el.style.fillOpacity = ''; el.removeAttribute('filter'); return; }
      el.style.fill = `var(--c${col})`; el.style.fillOpacity = (0.35 + 0.65 * a).toFixed(3); el.setAttribute('filter', 'url(#soft)');
    };
    const padEls = Object.fromEntries(PADS.map(p => [p.k, $('disco-p' + p.k)]));

    // ---------- HTML controls under the plate (big, touchable) ----------
    const ui = document.createElement('style');
    ui.textContent = `
      .disco-pad { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:8px; margin:6px 0 2px; }
      .disco-pad button { font:inherit; font-size:11px; letter-spacing:.06em; color:var(--ink); background:var(--bg); border:1px solid var(--edge);
        border-radius:12px; padding:9px 6px; cursor:pointer; touch-action:manipulation; min-height:44px; display:grid; gap:4px; justify-items:center; }
      .disco-pad button i { width:20px; height:4px; border-radius:2px; background:var(--detail); }
      .disco-pad button:hover { color:var(--ink-hi); }
      .disco-pad button.on { color:var(--accent-hi); border-color:var(--accent); }
      .disco-pad button.on i { background:var(--accent); box-shadow:0 0 8px var(--accent); }
      #stageHolder { height:clamp(220px, calc(100dvh - 290px - var(--navh, 0px)), 62vw) !important; }
      .disco-touch { display:none; }
      @media (max-width: 700px) {
        .disco-keys { display:none; } .disco-touch { display:inline; }
        .disco-pad { grid-template-columns:repeat(3, minmax(0,1fr)); }
        #stageHolder { height:clamp(240px, calc(100dvh - 360px - var(--navh, 0px)), calc(100vw - 20px)) !important; }
        figure { padding:14px 12px; }
      }`;
    document.head.append(ui);
    const hintEl = document.getElementById('hint');
    if (hintEl) hintEl.innerHTML = '<span class="disco-keys">Треки 1–4 або кнопки · пробіл — стоп / старт · L — режим світла</span><span class="disco-touch">Обери трек кнопкою — і на танцпол</span>';
    const bar = document.createElement('div');
    bar.className = 'disco-pad';
    const LABELS = { t0: '1 · Дискотека 77', t1: '2 · Нічний Київ', t2: '3 · Фанк-сода', t3: '4 · Неоновий Дніпро', stop: '■ Стоп', light: 'Світло' };
    bar.innerHTML = PADS.map(p => `<button type="button" data-pad="${p.k}"><i></i><span>${LABELS[p.k]}</span></button>`).join('');
    stage.parentElement.after(bar);
    const btns = Object.fromEntries([...bar.querySelectorAll('button')].map(b => [b.dataset.pad, b]));

    // ---------- music: four original patterns synthesised with WebAudio ----------
    const hz = m => 440 * 2 ** ((m - 69) / 12);
    let A = null, mix = null, NOISE = null;
    function audio() {
      A = api.audio();
      if (!mix) {
        const { ctx, out } = A;
        mix = ctx.createGain(); mix.gain.value = 0.55;
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
        mix.connect(comp); comp.connect(out);
        NOISE = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const ch = NOISE.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      return A;
    }
    const I = {
      env(node, t, peak, dur, attack = 0.003) {
        const g = A.ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        node.connect(g); g.connect(mix); return g;
      },
      kick(t, v = 1) {
        const o = A.ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
        I.env(o, t, 0.95 * v, 0.34); o.start(t); o.stop(t + 0.36);
      },
      noise(t, type, f, q, peak, dur) {
        const n = A.ctx.createBufferSource(); n.buffer = NOISE;
        const b = A.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
        n.connect(b); I.env(b, t, peak, dur, 0.001); n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
      },
      hat(t, open = false, v = 1) { I.noise(t, 'highpass', 7600, 0.7, (open ? 0.16 : 0.11) * v, open ? 0.2 : 0.035); },
      clap(t, v = 1) { [0, 0.011, 0.023].forEach(d => I.noise(t + d, 'bandpass', 1500, 0.9, 0.42 * v, 0.11)); },
      snare(t, v = 1) {
        I.noise(t, 'bandpass', 1900, 0.8, 0.38 * v, 0.16);
        const o = A.ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.1);
        I.env(o, t, 0.25 * v, 0.12); o.start(t); o.stop(t + 0.14);
      },
      bass(t, m, dur, type = 'sawtooth', cut = 700) {
        const o = A.ctx.createOscillator(); o.type = type; o.frequency.value = hz(m);
        const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 6;
        f.frequency.setValueAtTime(cut * 2.4, t); f.frequency.exponentialRampToValueAtTime(cut * 0.6, t + dur);
        o.connect(f); I.env(f, t, 0.32, dur); o.start(t); o.stop(t + dur + 0.02);
      },
      chord(t, ms, dur, v = 0.06, type = 'sawtooth', cut = 2400) {
        const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut;
        I.env(f, t, v, dur, 0.006);
        ms.forEach(m => [-7, 7].forEach(dt => { const o = A.ctx.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = dt;
          o.connect(f); o.start(t); o.stop(t + dur + 0.02); }));
      },
      lead(t, m, dur, v = 0.05) {
        const o = A.ctx.createOscillator(); o.type = 'square'; o.frequency.value = hz(m);
        const f = A.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
        o.connect(f); I.env(f, t, v, dur); o.start(t); o.stop(t + dur + 0.02);
      },
    };
    const minor = r => [r, r + 3, r + 7], major = r => [r, r + 4, r + 7];
    const SONGS = [
      { name: 'Дискотека 77', bpm: 120, play(s, b, t, d16) {      // four-on-the-floor, octave bass, offbeat strings
          const R = [45, 50, 43, 48][b], C = [minor(57), minor(62), major(55), major(60)][b];
          if (s % 4 === 0) I.kick(t);
          if (s === 4 || s === 12) I.clap(t);
          if (s % 4 === 2) I.hat(t, true); else if (s % 2) I.hat(t, false, 0.6);
          if (s % 2 === 0) I.bass(t, s % 4 === 0 ? R : R + 12, d16 * 1.6);
          if (s % 4 === 2) I.chord(t, C, d16 * 1.4);
        } },
      { name: 'Нічний Київ', bpm: 124, play(s, b, t, d16) {       // house: 16th hats, offbeat bass, syncopated stabs
          const R = [41, 37, 44, 39][b], C = [minor(65), major(61), major(60), major(63)][b];
          if (s % 4 === 0) I.kick(t);
          if (s === 4 || s === 12) I.clap(t, 0.9);
          I.hat(t, s % 4 === 2, s % 4 === 2 ? 1 : 0.45);
          if (s % 4 === 2) I.bass(t, R, d16 * 1.8, 'square', 420);
          if (s === 11) I.bass(t, R + 12, d16, 'square', 420);
          if (s === 3 || s === 10) I.chord(t, C, d16 * 2.2, 0.075, 'sawtooth', 1700);
        } },
      { name: 'Фанк-сода', bpm: 104, play(s, b, t, d16) {         // syncopated kick, slap riff, chicken-scratch
          const o = [0, 0, 5, 7][b];
          if (s === 0 || s === 7 || s === 10) I.kick(t);
          if (s === 4 || s === 12) I.snare(t); if (s === 9 || s === 15) I.snare(t, 0.25);
          I.hat(t, false, s % 2 ? 0.45 : 0.8);
          const riff = { 0: 40, 3: 40, 6: 43, 7: 45, 10: 52, 12: 50, 14: 47 };
          if (riff[s]) I.bass(t, riff[s] + o, d16 * 0.9, 'square', 800);
          if ([2, 6, 11, 14].includes(s)) I.chord(t, [64 + o, 68 + o, 74 + o], d16 * 0.5, 0.05, 'square', 2200);
        } },
      { name: 'Неоновий Дніпро', bpm: 100, play(s, b, t, d16) {   // synthwave: half-time beat, pulsing bass, arpeggio
          const R = [45, 41, 48, 43][b], C = b === 0 ? minor(R + 12) : major(R + 12);
          if (s === 0 || s === 8 || s === 10) I.kick(t);
          if (s === 4 || s === 12) I.snare(t, 1.1);
          if (s % 2 === 0) I.hat(t, false, 0.5);
          if (s % 2 === 0) I.bass(t, R, d16 * 1.7, 'sawtooth', 380);
          const arp = [C[0] + 12, C[1] + 12, C[2] + 12, C[0] + 24];
          I.lead(t, arp[s % 4], d16 * 0.9);
          if (s === 0) I.chord(t, C, d16 * 15, 0.035, 'sawtooth', 1200);
        } },
    ];
    const st = { track: -1, last: 0, step: 0, next: 0, light: 0, beatT: -9, beats: 0, rot: 0, t: 0, lastTs: 0,
                 low: 0, mid: 0, high: 0, beatQ: [], lastTrack: 0 };
    const MODES = ['музика', 'стробо', 'вимк'];

    api.every(25, () => {                                         // look-ahead sequencer
      if (st.track < 0 || !A) return;
      const song = SONGS[st.track], d16 = 60 / song.bpm / 4, ctx = A.ctx;
      while (st.next < ctx.currentTime + 0.12) {
        const s = st.step % 16, b = (st.step >> 4) % 4;
        try { song.play(s, b, st.next, d16); } catch (e) {}

    function play(i) {
      audio();
      st.track = i; st.lastTrack = i; st.step = 0; st.beatQ = [];
      st.next = A.ctx.currentTime + 0.05;
      ui_(); readout();
    }
    function stop() { st.track = -1; st.beatQ = []; ui_(); readout(); }
    function pad(k) {
      if (k === 'stop') { st.track >= 0 ? stop() : play(st.lastTrack); return; }
      if (k === 'light') { st.light = (st.light + 1) % 3; ui_(); readout(); return; }
      const i = +k.slice(1); st.track === i ? stop() : play(i);
    }
    function ui_() {
      PADS.forEach(p => {
        const on = p.k === 'stop' ? st.track < 0 : p.k === 'light' ? st.light !== 2 : st.track === +p.k.slice(1);
        padEls[p.k].classList.toggle('on', on); padEls[p.k].querySelector('.pad').classList.toggle('on', on);
        btns[p.k].classList.toggle('on', on);
      });
      btns.light.querySelector('span').textContent = 'Світло: ' + MODES[st.light];
      btns.stop.querySelector('span').textContent = st.track >= 0 ? '■ Стоп' : '▶ Старт';
      api.power(st.track >= 0 && st.light !== 2);
    }
    function readout() {
      api.readout(st.track >= 0 ? `▶ ${SONGS[st.track].name} · ${SONGS[st.track].bpm} bpm · світло: ${MODES[st.light]}`
                                : `тиша · обери трек 1–4 · світло: ${MODES[st.light]}`);
    }

    stage.addEventListener('click', e => { const g = e.target.closest('[data-pad]'); if (g) pad(g.dataset.pad); });
    bar.addEventListener('click', e => { const b = e.target.closest('button[data-pad]'); if (b) pad(b.dataset.pad); });

    // ---------- light show, driven by the analyser and the sequencer's beat times ----------
    const POSES = [[[-8,-37],[8,-37]], [[-9,-22],[9,-31]], [[-7,-18],[7,-18]], [[-8,-20],[9,-38]], [[-10,-28],[10,-28]]];
    const spk = Array.from({ length: sparks.length }, (_, i) => ({ th: Math.random() * Math.PI * 2, ph: -1.25 + Math.random() * 1.6, s: Math.random() * 6 }));
    const gl = glints.map(() => ({ x: (Math.random() - 0.5) * 22, y: (Math.random() - 0.5) * 22 }));
    let fbuf = null;

    api.loop(ts => {
      const dt = st.lastTs ? Math.min(0.1, (ts - st.lastTs) / 1000) : 0; st.lastTs = ts; st.t += dt;
      const playing = st.track >= 0 && A, lightOn = st.light !== 2;
      // bands from the analyser (bins of ~47 Hz)
      if (playing) {

        an.getByteFrequencyData(fbuf);
        const avg = (a, b) => { let s = 0; for (let i = a; i <= b; i++) s += fbuf[i]; return s / (b - a + 1) / 255; };
        st.low = Math.max(st.low * 0.86, avg(1, 4)); st.mid = Math.max(st.mid * 0.88, avg(8, 40)); st.high = Math.max(st.high * 0.85, avg(90, 200) * 1.8);

      } else { st.low *= 0.9; st.mid *= 0.9; st.high *= 0.9; }

      const L = Math.min(1, st.low), Mi = Math.min(1, st.mid), H = Math.min(1, st.high);

            const opts = [[1,0],[-1,0],[0,1],[0,-1]].map(([a, b]) => [d.tile[0] + a, d.tile[1] + b])
              .filter(([i, j]) => i >= 0 && i < N && j >= 2 && j < N && !taken.has(i + ',' + j));
            if (!opts.length) return;
            d.to = opts[Math.floor(Math.random() * opts.length)];

        }
      }

        if (!d.mv) return;
        const p = Math.min(1, (st.t - d.mv.t0) / d.mv.dur), e = p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2, T = tileC(...d.to);
        d.w = [d.mv.from[0] + (T[0] - d.mv.from[0]) * e, d.mv.from[1] + (T[1] - d.mv.from[1]) * e];
        d.hop = Math.sin(Math.PI * p) * 7;
        if (p >= 1) { d.tile = d.to; d.mv = null; d.hop = 0; flashT[d.tile.join(',')] = { t: st.t, col: d.col }; }
      });

      // floor tiles: a new pattern every 8 beats, flashing on each beat
      const pat = Math.floor(st.beats / 8) % 4, bt = st.beats;
      tilesEl.forEach(({ i, j, el }) => {
        const ring = Math.max(Math.abs(i - 3), Math.abs(j - 3));
        let on, col;
        if (pat === 0) { on = (i + j + bt) % 2 === 0; col = 1 + (bt % 3); }
        else if (pat === 1) { on = ring === bt % 4; col = 1 + (ring % 3); }
        else if (pat === 2) { on = (i + j) % 4 === bt % 4; col = 1 + ((i + j) % 3); }
        else { on = ((i * 7 + j * 13 + bt * 5) % 5) < 2; col = 1 + ((i * 3 + j + bt) % 3); }
        let o = !playing || !lightOn ? (lightOn ? 0.05 + 0.04 * Math.sin(st.t * 1.5 + i + j) : 0) : on ? 0.3 + 0.7 * Math.max(env, L * 0.6) : 0.05;
        const fl = flashT[i + ',' + j];   // the tile a dancer just landed on lights up in that dancer's colour
        if (fl && lightOn) { const f = Math.exp(-(st.t - fl.t) * 3); if (f > 0.03) { o = Math.max(o, 0.95 * f); col = fl.col; } else delete flashT[i + ',' + j]; }
        el.setAttribute('opacity', o.toFixed(3));
        el.setAttribute('class', 'tile k' + col);
      });

      // mirror ball: spin, meridians, glints, reflections around the room
      st.rot += dt * (playing ? 0.9 : 0.25);
      const [bx, by] = P(...BALL);
      let m = '';
      for (let k = 0; k < 6; k++) { const a = st.rot + k * Math.PI / 6, rx = Math.abs(14 * Math.sin(a)); m += `<ellipse class="facet" cx="${f2(bx)}" cy="${f2(by)}" rx="${f2(rx)}" ry="14"/>`; }
      mer.innerHTML = m;
      glints.forEach((g, k) => {
        const on = lightOn && Math.random() < 0.12 + H * 0.5;
        g.setAttribute('x', f2(bx + gl[k].x - 1.3)); g.setAttribute('y', f2(by + gl[k].y - 1.3)); g.setAttribute('opacity', on ? '1' : '0');
      });
      const sparkBase = lightOn ? (playing ? 0.35 + 0.65 * Math.max(H, env * 0.6) : 0.25) : 0.06;
      spk.forEach((s, k) => {
        const th = s.th + st.rot, c = Math.cos(s.ph), d = [c * Math.cos(th), c * Math.sin(th), Math.sin(s.ph)];
        let best = null, tb = 1e9;
        const tryHit = (t, chk) => { if (t > 0 && t < tb) { const h = [BALL[0] + d[0] * t, BALL[1] + d[1] * t, BALL[2] + d[2] * t]; if (chk(h)) { tb = t; best = h; } } };
        if (d[2] < -0.02) tryHit((4 - BALL[2]) / d[2], h => h[0] > 6 && h[0] < 300 && h[1] > 6 && h[1] < 240);
        if (d[1] < -0.02) tryHit((6 - BALL[1]) / d[1], h => h[0] > 6 && h[0] < 300 && h[2] > 0 && h[2] < 124);
        if (d[0] < -0.02) tryHit((6 - BALL[0]) / d[0], h => h[1] > 6 && h[1] < 240 && h[2] > 0 && h[2] < 124);
        const el = sparks[k];
        if (!best) { el.setAttribute('opacity', '0'); return; }
        const [sx, sy] = P(...best);
        el.setAttribute('cx', f2(sx)); el.setAttribute('cy', f2(sy));
        el.setAttribute('opacity', (sparkBase * (0.55 + 0.45 * Math.sin(st.t * 7 + s.s))).toFixed(3));
      });

      // PAR beams sweep the floor; each colour follows one band
      const lvl = [L, Mi, H, L], spots = [], amps = [];
      LAMPS.forEach((lx, k) => {
        const a = playing && lightOn ? Math.min(1, 0.15 + lvl[k] * 0.9 + env * 0.25) : 0;
        const sx = 180 + 52 * Math.sin(st.t * 0.55 + k * 1.7), sy = 156 + 48 * Math.cos(st.t * 0.47 + k * 2.3);
        const [lx2, ly2] = P(lx, 66, 157), [px, py] = P(sx, sy, 4), rx = 30, ry = 17;
        beams[k].setAttribute('d', `M${f2(lx2 - 2)} ${f2(ly2)}L${f2(px - rx)} ${f2(py)}A${rx} ${ry} 0 0 0 ${f2(px + rx)} ${f2(py)}L${f2(lx2 + 2)} ${f2(ly2)}Z`);
        beams[k].setAttribute('opacity', (a * 0.16).toFixed(3));
        pools[k].setAttribute('cx', f2(px)); pools[k].setAttribute('cy', f2(py)); pools[k].setAttribute('opacity', (a * 0.55).toFixed(3));
        lens[k].setAttribute('opacity', (0.15 + a * 0.85).toFixed(3));
        spots.push([sx, sy]); amps.push(a);
      });
      const COLS = [1, 2, 3, 1];
      dancers.forEach(d => {
        let kb = 0, db = 1e9;
        spots.forEach(([sx, sy], k) => { const v = Math.hypot(sx - d.w[0], sy - d.w[1]); if (v < db) { db = v; kb = k; } });
        d.col = COLS[kb];
        paintHead(d.h, COLS[kb], amps[kb] * Math.max(0.55, 1 - db / 90));
      });

      // strobe mode: short white flashes on the beat
      const flash = playing && st.light === 1 && (st.t - st.beatT) < 0.05;
      strobe.setAttribute('opacity', flash ? '0.32' : '0');

      // people, decks, speakers, meters, neon
      const bob = env * 2.5;
      dancers.forEach((d, i) => {
        const pose = POSES[playing ? (st.beats + d.ph * 2 + i) % POSES.length : 2], [[hlx, hly], [hrx, hry]] = pose;
        d.p.setAttribute('d', `M-4 0 L0 -14 L4 0 M0 -14 L0 -28 M${hlx} ${hly} L-2.5 -26 L2.5 -26 L${hrx} ${hry}`);
        const [gx, gy] = P(d.w[0], d.w[1], 4 + d.hop);
        d.g.setAttribute('transform', `translate(${f2(gx)} ${f2(gy - (playing && !d.mv ? bob * (i % 2 ? 1 : 0.6) : 0))})`);
      });
      const sorted = dancers.slice().sort((a, b) => (a.w[0] + a.w[1]) - (b.w[0] + b.w[1]));   // paint order = depth
      const key = sorted.map(d => d.g.id).join();
      if (key !== crowdOrder) { sorted.forEach(d => crowd.appendChild(d.g)); crowdOrder = key; }
      dj.setAttribute('transform', `translate(${f2(djx)} ${f2(djy - (playing ? bob * 0.6 : 0))})`);
      plat.forEach((p, k) => p.setAttribute('transform', `rotate(${f2((playing ? st.t * 200 : 0) * (k ? 1 : 1.03))} ${k ? 128 : 32} 12)`));
      fader.forEach((f, k) => f.setAttribute('y', f2(12 - [L, Mi, H, (L + H) / 2][k] * 4)));
      cones.forEach(c => c.setAttribute('r', f2(8 * (1 + 0.14 * (playing ? Math.max(L, env) : 0)))));
      vu.forEach((v, k) => { const h = 18 * Math.min(1, [L, Mi, H][k]); v.setAttribute('y', f2(26 - h)); v.setAttribute('height', f2(h)); });
      neon.classList.toggle('off', !lightOn || (playing && st.light === 0 && env < 0.15 && (st.beats % 8) === 7));
    });

    ui_(); readout();
    return {
      key(e) {
        if (e.key >= '1' && e.key <= '4') { pad('t' + (+e.key - 1)); return true; }
        if (e.key === ' ' || e.key === 'Enter') { pad('stop'); return true; }
        if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') { pad('light'); return true; }
        if (e.key === 'ArrowRight') { play(((st.track < 0 ? st.lastTrack : st.track) + 1) % 4); return true; }
        if (e.key === 'ArrowLeft') { play(((st.track < 0 ? st.lastTrack : st.track) + 3) % 4); return true; }
        return false;
      },
      unmount() { stop(); bar.remove(); ui.remove(); },
      demo() {},
    };
  },
});

<!-- CORE: kernel, api, navigation, palette picker. Keep after the figures. -->
<script>
/* ============================================================
   iso gallery core: kernel, shared api, navigation.
   Figures register with FIGS.push({...}) — see CONTRACT below.
   ============================================================ */
// FIGS is declared inline in the page before the figure scripts

const ISO = (() => {
  const C = Math.cos(Math.PI / 6), S = Math.sin(Math.PI / 6);
  function kernel(OX, OY) {
    const P = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];
    const D = (x,y,z) => [(x-y)*C, (x+y)*S - z];
    const plane = (O,U,V) => { const o=P(...O), u=D(...U), v=D(...V);
      return `matrix(${u[0]} ${u[1]} ${v[0]} ${v[1]} ${o[0]} ${o[1]})`; };
    const TOP   = (x,y,z) => plane([x,y,z],[1,0,0],[0,1,0]);
    const FRONT = (x,y,z) => plane([x,y,z],[1,0,0],[0,0,-1]);
    const SIDE  = (x,y,z) => plane([x,y,z],[0,-1,0],[0,0,-1]);
    const rect = (t,w,h,r=0,cls='face') => `<g transform="${t}"><rect class="${cls}" width="${w}" height="${h}" rx="${r}"/></g>`;
    // Rounded box: one rounded top plus one continuous side wall along the visible part of the
    // outline, so the corners meet cleanly. r = 0 keeps the classic three flat faces.
    const rounded = (x,y,z,w,d,h,r,cls) => {
      r = Math.min(r, w/2, d/2);
      const n = 10, z1 = z + h, q = Math.PI/4, H = Math.PI/2, c = cls ? ' ' + cls : '';
      const arc = (cx,cy,a0,a1) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1-a0)*i/n; o.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } return o; };
      const ring = [...arc(x+w-r,y+r,-H,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,2*H), ...arc(x+r,y+r,2*H,3*H)];
      const vis  = [...arc(x+w-r,y+r,-q,0), ...arc(x+w-r,y+d-r,0,H), ...arc(x+r,y+d-r,H,3*q)];
      const d3 = pts => 'M' + pts.map(p => P(...p).map(v => v.toFixed(2)).join(' ')).join('L') + 'Z';
      const wall = [...vis.map(([a,b]) => [a,b,z]), ...vis.slice().reverse().map(([a,b]) => [a,b,z1])];
      return `<path class="face${c}" d="${d3(wall)}"/><path class="face top${c}" d="${d3(ring.map(([a,b]) => [a,b,z1]))}"/>`;
    };
    const box = (x,y,z,w,d,h,r=0) => r > 0 ? rounded(x,y,z,w,d,h,r,'') :
      rect(SIDE(x+w,y+d,z+h), d,h) + rect(FRONT(x,y+d,z+h), w,h) + rect(TOP(x,y,z+h), w,d,0,'face top');
    const boxc = (x,y,z,w,d,h,r,cls) => r > 0 ? rounded(x,y,z,w,d,h,r,cls) :
      rect(SIDE(x+w,y+d,z+h), d,h,0,'face '+cls) + rect(FRONT(x,y+d,z+h), w,h,0,'face '+cls) + rect(TOP(x,y,z+h), w,d,0,'face top '+cls);
    // 3D polyline -> SVG path "d"
    const path = pts => 'M' + pts.map(p => P(...p).map(n => n.toFixed(2)).join(' ')).join('L');
    return { C, S, P, D, plane, TOP, FRONT, SIDE, rect, box, boxc, path };
  }
  // Frame a scene: pass its extreme 3D corners. Returns kernel + viewBox padded to ~4:3.
  function frame(points, margin = 0.09, aspect = 4 / 3) {
    const d = points.map(([x,y,z]) => [(x-y)*C, (x+y)*S - z]);
    let x0 = Math.min(...d.map(p => p[0])), x1 = Math.max(...d.map(p => p[0]));
    let y0 = Math.min(...d.map(p => p[1])), y1 = Math.max(...d.map(p => p[1]));
    const m = margin * Math.max(x1 - x0, y1 - y0);
    let w = x1 - x0 + 2*m, h = y1 - y0 + 2*m;
    let ox = m - x0, oy = m - y0;
    if (w / h < aspect) { const nw = h * aspect; ox += (nw - w) / 2; w = nw; }
    else { const nh = w / aspect; oy += (nh - h) / 2; h = nh; }
    return { ...kernel(ox, oy), viewBox: `0 0 ${w.toFixed(1)} ${h.toFixed(1)}`, W: w, H: h };
  }
  // repeated detail lines in a face-local group
  const slits = (a0, a1, step, b0, b1, vertical = true, cls = 'detail') => {
    let s = ''; for (let a = a0; a <= a1 + 1e-6; a += step)
      s += vertical ? `<line class="${cls}" x1="${a}" y1="${b0}" x2="${a}" y2="${b1}"/>` : `<line class="${cls}" x1="${b0}" y1="${a}" x2="${b1}" y2="${a}"/>`;
    return s;
  };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return { kernel, frame, slits, esc };
})();

/* ---------- shared audio (created on first user gesture) ---------- */
const AUDIO = (() => {
  let ctx = null, out = null, analyser = null;
  return () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.5;
      analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      out.connect(analyser); analyser.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return { ctx, out, analyser };
  };
})();

/* ---------- app ---------- */
(function app() {
  const $ = id => document.getElementById(id);
  const CFG = window.GALLERY || {};
  const holder = $('stageHolder'), readoutEl = $('readout'), hintEl = $('hint'), numEl = $('fignum'), nameEl = $('figname');
  const nav = $('nav');
  let active = null, handle = null, timers = [], frames = [], idx = 0;

  const api = {
    iso: ISO,
    readout: s => { readoutEl.textContent = s; },
    hint: s => { hintEl.textContent = s; },
    audio: AUDIO,
    after: (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; },
    every: (ms, fn) => { const t = setInterval(fn, ms); timers.push(t); return t; },
    loop: fn => { let alive = true; const f = ts => { if (!alive) return; fn(ts); requestAnimationFrame(f); };
      requestAnimationFrame(f); const stop = () => { alive = false; }; frames.push(stop); return stop; },
    // light a pressable briefly (orange flash + glow, then fade)
    flash: (el, ms = 160) => { if (!el) return; el.classList.add('down', 'lit'); clearTimeout(el._f1); clearTimeout(el._f2);
      el._f1 = setTimeout(() => el.classList.remove('down'), 110); el._f2 = setTimeout(() => el.classList.remove('lit'), ms); },
    // restart a one-shot CSS animation class (e.g. '.pulse' -> 'go')
    replay: (el, cls = 'go') => { if (!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); },
    power: on => { holder.classList.toggle('glow', !!on); },
  };

  function mount(i) {
    if (handle && handle.unmount) handle.unmount();
    timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
    frames.forEach(stop => stop()); frames = [];
    idx = (i + FIGS.length) % FIGS.length; active = FIGS[idx];
    holder.classList.remove('glow');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('id', 'stage'); svg.setAttribute('role', 'img'); svg.setAttribute('tabindex', '0');
    svg.setAttribute('aria-label', active.aria || active.name);
    svg.dataset.fig = active.id;
    holder.replaceChildren(svg);
    numEl.textContent = `Fig ${idx + 1}`; nameEl.textContent = active.name;
    hintEl.textContent = active.hint || ''; readoutEl.textContent = '';
    document.title = `Fig ${idx + 1} · ${active.name}`;
    [...nav.querySelectorAll('button[data-i]')].forEach(b => b.setAttribute('aria-current', +b.dataset.i === idx ? 'true' : 'false'));
    const cur = nav.querySelector(`button[data-i="${idx}"]`);
    if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: cur.offsetLeft - nav.clientWidth / 2 + cur.offsetWidth / 2, behavior: 'smooth' });
    if (location.hash.slice(1) !== active.id) history.replaceState(null, '', '#' + active.id);
    handle = active.mount(svg, api) || {};
    // demo(): with ?demo, or on every arrival when GALLERY.autoDemo is true (?still disables)
    const runDemo = /demo/.test(location.search) || (CFG.autoDemo && !/still/.test(location.search));
    if (runDemo && handle.demo) setTimeout(() => handle.demo(), 120);
  }

  // ---------- glow colour choice ----------
  const PALETTES = {
    // [name, dark accent, dark hi, light accent, light hi]
    ember: [['Ember','#ff7a1a','#ffb070','#f06a00','#ff8c2e'], ['Cyan','#22d3ee','#9beefa','#0891b2','#06a8c6'], ['Lime','#a3e635','#d6f79f','#4d7c0f','#5f960f'],
            ['Violet','#a78bfa','#d6caff','#7c3aed','#8b5cf6'], ['Rose','#fb7185','#fdb8c2','#e11d48','#f43f5e'], ['Ice','#dfe9ef','#ffffff','#1f2937','#3b4656']],
    city:  [['Sodium','#ff9a2e','#ffc77a','#d97706','#f59e0b'], ['Tungsten','#ffd166','#ffe7a8','#a16207','#ca8a04'], ['Neon','#ff4fa3','#ff9fcb','#db2777','#ec4899'],
            ['Signal','#3ee8a0','#a3f5cf','#047857','#059669'], ['Dusk','#6f9dff','#b5ccff','#2f5bd3','#4a72e8'], ['Moon','#dfe7f5','#ffffff','#273246','#3d4a61']],
  };
  const ACCENTS = Array.isArray(CFG.palette) ? CFG.palette : (PALETTES[CFG.palette] || PALETTES.ember);
  const vars = (a, hi, dark) => `--accent:${a}; --accent-hi:${hi}; --accent-dim:color-mix(in srgb, ${a} ${dark ? 10 : 8}%, transparent);` +
    ` --glass-on:color-mix(in srgb, ${a} ${dark ? 9 : 12}%, ${dark ? '#101112' : '#eef0f0'});`;
  const accentCss = ACCENTS.map(([n, da, dh, la, lh]) => { const k = n.toLowerCase();
    return `:root[data-accent="${k}"] { ${vars(da, dh, true)} }
@media (prefers-color-scheme: light) { :root[data-accent="${k}"]:not([data-theme="dark"]) { ${vars(la, lh, false)} } }
:root[data-accent="${k}"][data-theme="light"] { ${vars(la, lh, false)} }`; }).join('\n');
  const accentStyle = document.createElement('style'); accentStyle.textContent = accentCss; document.head.appendChild(accentStyle);
  const sw = $('swatches');
  sw.innerHTML = ACCENTS.map(([n, da]) => `<button role="radio" data-accent="${n.toLowerCase()}" aria-label="${n}" title="${n}" style="--sw:${da}"><i></i></button>`).join('');
  function setAccent(k) {
    if (!ACCENTS.some(a => a[0].toLowerCase() === k)) k = ACCENTS[0][0].toLowerCase();
    document.documentElement.dataset.accent = k;
    sw.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.accent === k ? 'true' : 'false'));
    try { localStorage.setItem((CFG.storageKey || 'iso-glow-accent'), k); } catch (e) {}
  }
  let saved = null; try { saved = localStorage.getItem((CFG.storageKey || 'iso-glow-accent')); } catch (e) {}
  setAccent(saved || ACCENTS[0][0].toLowerCase());
  sw.addEventListener('click', e => { const b = e.target.closest('button[data-accent]'); if (b) { setAccent(b.dataset.accent); const s = $('stage'); if (s) s.focus({ preventScroll: true }); } });

  // per-figure css
  FIGS.forEach(f => { if (f.css) { const st = document.createElement('style'); st.textContent = f.css; document.head.appendChild(st); } });

  // navigation markup
  nav.innerHTML = FIGS.map((f, i) =>
    `<button data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${f.name}</span></button>`).join('');
  // after a nav click, hand keyboard focus to the figure so space/enter go to it, not the button
  const focusStage = () => { const s = $('stage'); if (s) s.focus({ preventScroll: true }); };
  nav.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { mount(+b.dataset.i); focusStage(); } });
  $('prev').addEventListener('click', () => { mount(idx - 1); focusStage(); });
  $('next').addEventListener('click', () => { mount(idx + 1); focusStage(); });
  window.addEventListener('hashchange', () => { const i = FIGS.findIndex(f => f.id === location.hash.slice(1)); if (i >= 0 && i !== idx) mount(i); });

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button') && (e.key === 'Enter' || e.key === ' ')) return;
    if (handle && handle.key && handle.key(e)) { e.preventDefault(); return; }
    if (e.key === 'PageDown') mount(idx + 1);
    if (e.key === 'PageUp') mount(idx - 1);
  });
  window.addEventListener('keyup', e => { if (handle && handle.keyup) handle.keyup(e); });
  window.addEventListener('blur', () => { if (handle && handle.blur) handle.blur(); });

  if (!FIGS.length) {   // nothing registered yet (figures still being built)
    holder.innerHTML = '<p style="display:grid;place-items:center;height:100%;margin:0;letter-spacing:.14em;text-transform:uppercase">No figures yet</p>';
    numEl.textContent = 'Fig —'; return;
  }
  const start = FIGS.findIndex(f => f.id === location.hash.slice(1));
  mount(start >= 0 ? start : 0);
})();

</script>
</body>
</html>
